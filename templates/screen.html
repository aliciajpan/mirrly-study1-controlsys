<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Mirrly — Screen</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html, body { margin:0; padding:0; background:#000; height:100%; }
      #wrap { display:flex; align-items:center; justify-content:center; height:100%; }
      video, audio, img { max-width:100vw; max-height:100vh; }
      #debug { position:fixed; top:8px; left:8px; color:#9aa; font:12px monospace; }
    </style>
  </head>
  <body>
    <div id="wrap">
      <video id="v" playsinline></video>
      <audio id="a"></audio>
      <img id="i" />
    </div>
    <div id="debug"></div>
    <script src="/static/screen.js"></script>
  </body>
</html>
