<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Mirrly — Control</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body { font-family: system-ui, sans-serif; padding: 20px; max-width: 900px; margin: 0 auto; }
      fieldset { border:1px solid #ddd; border-radius:10px; padding:16px; margin-bottom:16px; }
      label { display:block; margin:8px 0 4px; }
      input[type=text], select { width:100%; padding:8px; }
      button { padding:8px 12px; margin-right:8px; }
      .row { display:flex; gap:10px; align-items:center; }
      .row > * { flex:1; }
      #status { font:12px monospace; color:#555; }
      small code { background:#f6f6f6; padding:0 4px; border-radius:4px; }

      /* segmented control for format */
      .seg { display:inline-flex; border:1px solid #ddd; border-radius:999px; overflow:hidden; }
      .seg input { display:none; }
      .seg label {
        padding:6px 10px; cursor:pointer; user-select:none; font:12px system-ui, sans-serif;
        border-right:1px solid #ddd; background:#fafafa;
      }
      .seg label:last-of-type { border-right:none; }
      .seg input:checked + label { background:#e8f0ff; font-weight:600; }
    </style>
  </head>
  <body>
    <h1>Mirrly – Media Controller</h1>

    <!-- Load media -->
    <fieldset>
      <legend>Load media</legend>
      <div class="row">
        <div style="flex:0 0 140px;">
          <label>Type</label>
          <select id="mediaType">
            <option value="video">video</option>
            <option value="audio">audio</option>
            <option value="image">image</option>
          </select>
        </div>
        <div style="flex:1;">
          <label>URL (can be /static/... or https://...)</label>
          <input id="mediaUrl" type="text" placeholder="/static/media/test.mp4" />
        </div>
        <div style="flex:0;">
          <label style="visibility:hidden;">&nbsp;</label>
          <button id="loadBtn">Load</button>
        </div>
      </div>
    </fieldset>

    <!-- Playback controls -->
    <fieldset>
      <legend>Playback</legend>
      <button id="toggleBtn">Play</button>
      <button id="resetBtn" title="Seek to 0s">Reset</button>

      <div style="margin-top:14px;">
        <label for="seekSlider">Seek</label>
        <input id="seekSlider" type="range" min="0" max="0" step="0.1" value="0" style="width:100%;">
        <div style="display:flex; justify-content:space-between; font:12px/1.6 monospace; color:#555;">
          <span id="seekNow">0:00s</span>
          <span id="seekDur">0:00s</span>
        </div>
      </div>

      <div style="margin-top:14px;">
        <label for="volSlider">Volume: <span id="volPct">100%</span></label>
        <input id="volSlider" type="range" min="0" max="100" step="1" value="100" style="width:100%;">
      </div>
    </fieldset>

    <!-- Scenario controls -->
    <fieldset>
      <legend>Scenario</legend>

      <!-- Paste JSON or YAML -->
      <label for="scenarioText">Scenario (JSON or YAML)</label>
      <textarea id="scenarioText" rows="8" style="width:100%; font-family:monospace;"
        placeholder='
# YAML example
steps:
  - { action: play_video, url: /static/media/video1.mp4 }
  - { action: wait, until: media_end }
'></textarea>

      <!-- Format pills + Run Text -->
      <div class="row" style="margin:8px 0; align-items:center;">
        <div style="flex:1; text-align:left;">
          <div id="fmtGroup" class="seg">
            <input type="radio" name="scenFmt" id="fmtAuto" checked>
            <label for="fmtAuto">Auto</label>

            <input type="radio" name="scenFmt" id="fmtJson">
            <label for="fmtJson">JSON</label>

            <input type="radio" name="scenFmt" id="fmtYaml">
            <label for="fmtYaml">YAML</label>
          </div>
          <small id="fmtHint" style="margin-left:8px; color:#777; font:12px;">Auto: —</small>
        </div>
        <div style="flex:0; text-align:right;">
          <button id="scenRunBtn" title="Run the text above">Run Text</button>
        </div>
      </div>

      <!-- Local file helpers -->
      <div style="margin:8px 0;">
        <input id="scenFile" type="file" accept=".json,.yaml,.yml">
        <button id="scenLoadLocalBtn" title="Load selected file content into the textbox">Load Local File</button>
        <button id="scenRunLocalBtn"  title="Parse & run selected file directly">Run Local File</button>
        <small style="color:#666; display:block; margin-top:4px;">
          “Run Local File” auto-detects JSON vs YAML.
        </small>
      </div>

      <!-- Server-side file 
      <label for="scenPath">Server file path (e.g., <code>scenarios/lesson1.yaml</code>)</label>
      <input id="scenPath" type="text" placeholder="scenarios/lesson1.yaml" style="width:100%;">
      <div style="margin:8px 0;">
        <button id="scenRunFileBtn">Run File</button>
      </div> -->

      <!-- Scenario runner controls -->
      <div style="margin:10px 0;">
        <button id="scenPauseBtn"> Pause</button>
        <button id="scenResumeBtn">Resume</button>
        <button id="scenStopBtn">Stop</button>
        <button id="scenResetBtn" title="Restart scenario from step 0">Reset Scenario</button>
      </div>


      <!-- Now/elapsed indicator -->
      <div id="nowWrap" style="display:flex; align-items:center; gap:10px; padding:8px; border:1px dashed #ddd; border-radius:8px; margin:10px 0;">
        <div style="font:12px monospace; color:#666;">Now:</div>
        <div style="flex:1; font:14px system-ui;">
          <strong id="nowActionLabel">—</strong>
          <small id="nowExtra" style="color:#777; margin-left:6px;"></small>
        </div>
        <div style="font:12px monospace; color:#333;">⏱ <span id="nowElapsed">00:00.0</span></div>
      </div>

      <!-- Live scenario status -->
      <div id="scenarioStatus" style="font:12px monospace; color:#555;">
        status: (idle)
      </div>
    </fieldset>

    <div id="status">state: (loading…)</div>

    <!-- cache-bust while developing -->
    <script src="/static/control.js?v=scenario-yaml-2"></script>
  </body>
</html>
