<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ app_title }}</title>
    <link rel="stylesheet" href="/static/css/styles.css" />
  </head>
  <body>
    <div id="controller" class="controller-grid">
      <header class="controller-header">
        <img src="/static/Logo SIRRL_Medium RGB_Horizontal Colour.png" alt="Mirrly HRI Study Logo" class="controller-logo" style="height:48px; vertical-align:middle;" />
        <button class="btn" id="btnOpenDisplay" style="margin-left:auto;">🖥 Open Display</button>
      </header>
      <aside id="sidebar" class="sidebar slim">
        <ul id="sectionList" class="section-list"></ul>
      </aside>
      <main class="controller-main">
        <section class="status-card">
          <div><strong>Current:</strong> <span id="currentSection"></span></div>
          <div><strong>Paused:</strong> <span id="pausedState"></span></div>
          <div style="margin-top:8px; padding-top:8px; border-top:1px solid #7c6fa6;"><strong id="robotStatus" style="color:#ef4444;">🤖 Disconnected</strong></div>
          <div id="robotMessage" style="display:none; margin-top:6px; padding:6px; background:#2a1f47; border-left:3px solid #fbbf24; font-size:0.9em; color:#fbbf24; word-break:break-word;"></div>
        </section>
        <section id="selectionPanel" class="selection-panel">
          <h3 style="margin-top:0">Round Response</h3>
          <div id="selectionButtons" class="btn-group"></div>
        </section>
            <footer style="text-align:center; font-size:0.8em; color:#a89ad7; margin:8px 0 2px 0; opacity:0.7;">version 1.0</footer>

      </main>
      <div class="controls-bar">
        <button class="btn" id="btnPrev">⟵ Prev</button>
        <button class="btn primary" id="btnPausePlay">⏸ Pause</button>
        <button class="btn" id="btnNext">Next ⟶</button>
    </div>
    </div>

    <script src="/static/js/controller.js"></script>
  </body>
</html>
