<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Display and Control Interface</title>
    <link rel="stylesheet" href="/static/css/styles.css" />
    <style>
        body, html { 
            margin: 0; 
            background:#000; 
        }
        #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#000; }
        #stage .media {
            display: block;
            margin: auto;
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
        }

        #menu-toggle {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(31, 41, 55, 0.7);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 1.2rem;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: background 0.2s;
        }
        #menu-toggle:active { background: rgba(31, 41, 55, 0.9); }

        #control-sidebar {
            position: fixed;
            top: 0;
            left: -350px; /* Hidden by default */
            width: 320px;
            height: 100%;
            background: #1e1e2e;
            color: #cdd6f4;
            box-shadow: 5px 0 25px rgba(0,0,0,0.5);
            transition: left 0.3s ease;
            z-index: 99;
            display: flex;
            flex-direction: column;
            padding: 80px 20px 20px 20px;
            box-sizing: border-box;
        }
        #control-sidebar.open { left: 0; }

        #sidebar-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; color: #a6e3a1; }

        #sectionList {
        list-style: none;
        padding: 0;
        margin: 0;
        overflow-y: auto;
        flex-grow: 1;
        }
        #sectionList li {
            padding: 12px;
            margin-bottom: 6px;
            background: #252538;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            border-left: 4px solid transparent;
        }
        #sectionList li.active {
            background: #45475a;
            border-left-color: #f38ba8;
            font-weight: bold;
            color: #fff;
        }

        #sidebar-status {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #313244;
            font-size: 0.85rem;
        }

        #ui-overlay { position: fixed; bottom: 10%; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 20px; z-index: 10; }
        .touch-btn { padding: 20px 40px; font-size: 2rem; font-weight: bold; color: white; background: #6366f1; border: none; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .touch-btn:active { background: #4f46e5; }
        #timer-display { font-size: 3rem; color: #ef4444; background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 8px; font-weight: bold; }

        #waiting { color:#fff; font-size:2rem; font-family:system-ui; }

        #timer-bar-container {
            position: fixed;
            top: 20px;
            left: 5%;
            width: 90%;
            height: 30px;
            background: rgba(255, 255, 255, 0.1);
            z-index: 1000;
            display: none; /* hidden by default, activated on countdown blocks */

            border: 3px solid #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            overflow: hidden;
            box-sizing: border-box;
        }

        #timer-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #9500ff, #d69dff);
            box-shadow: 0 2px 10px rgba(6, 182, 212, 0.5);
            transition: width 0.1s linear; /* updates bar size w smooth animation */
        }

    </style>
  </head>

  <body>
    <div id="timer-bar-container">
      <div id="timer-bar"></div>
    </div>

    <button id="menu-toggle">☰</button>

    <div id="control-sidebar">
      <div id="sidebar-title">Navigation</div>
      <ul id="sectionList">
      </ul>
      <div id="sidebar-status">
        <div id="robotStatus">Checking robot status...</div>
      </div>
    </div>

    <div id="stage"></div>
    <div id="ui-overlay"></div>
    
    <script src="/static/js/display.js"></script>
  </body>

</html>
