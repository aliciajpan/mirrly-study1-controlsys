<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mirrly Study Display</title>
    <link rel="stylesheet" href="/static/css/styles.css" />
    <style>
      /* Ensure clean edge-to-edge layout */
      html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: #000;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
      }

      /* Fullscreen presentation stage */
      #stage {
        width: 100vw;
        height: 100vh;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #000;
      }

      /* Media styling to preserve aspect ratio */
      .media {
        max-width: 100vw;
        max-height: 100vh;
        width: auto;
        height: auto;
        object-fit: contain;
      }

      /* Top countdown bar */
      #timer-bar-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 10px;
        background: rgba(255, 255, 255, 0.2);
        z-index: 99999;
        display: none;
      }

      #timer-bar {
        width: 100%;
        height: 100%;
        background: #ef4444;
        transition: width 0.1s linear;
      }

      /* Navigation menu button */
      #menu-toggle {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 1000005;
        background: rgba(30, 30, 46, 0.75);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(6px);
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 1.1rem;
        cursor: pointer;
        transition: background 0.2s;
      }

      #menu-toggle:hover {
        background: rgba(49, 50, 68, 0.9);
      }

      /* Slide-out navigation drawer */
      #control-sidebar {
        position: fixed;
        top: 0;
        left: -340px;
        width: 320px;
        height: 100vh;
        background: #181825;
        border-right: 1px solid #313244;
        box-shadow: 4px 0 24px rgba(0, 0, 0, 0.6);
        transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 1000005;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
      }

      #control-sidebar.open {
        left: 0;
      }

      /* Scrollable section item list */
      .sidebar-scroll-area {
        flex: 1;
        overflow-y: auto;
        padding: 60px 12px 12px 12px;
      }

      .section-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .section-list li {
        padding: 10px 14px;
        border-radius: 6px;
        background: #1e1e2e;
        color: #cdd6f4;
        cursor: pointer;
        font-size: 0.9rem;
        transition: background 0.15s, color 0.15s;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .section-list li:hover {
        background: #313244;
      }

      .section-list li.active {
        background: #89b4fa;
        color: #11111b;
        font-weight: bold;
      }

      /* Sticky bottom controls deck */
      #sidebar-bottom-controls {
        position: sticky;
        bottom: 0;
        left: 0;
        width: 100%;
        background: #11111b;
        border-top: 1px solid #313244;
        padding: 14px 14px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
        box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.4);
      }

      /* Session participant start modal */
      #session-modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000000;
      }

      .session-modal {
        background: #1e1e2e;
        border: 1px solid #313244;
        padding: 28px;
        border-radius: 12px;
        width: 340px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      }

      .session-modal h2 {
        margin: 0;
        color: #cdd6f4;
        font-size: 1.3rem;
      }

      .session-modal input {
        padding: 10px 12px;
        border-radius: 6px;
        border: 1px solid #45475a;
        background: #11111b;
        color: #fff;
        font-size: 1rem;
        outline: none;
      }

      .session-modal-btns {
        display: flex;
        gap: 10px;
      }

      .session-modal-btns button {
        flex: 1;
        padding: 10px;
        border-radius: 6px;
        border: none;
        font-weight: 600;
        cursor: pointer;
      }

      #btnModalStart {
        background: #89b4fa;
        color: #11111b;
      }

      #btnModalRandom {
        background: #313244;
        color: #cdd6f4;
      }
    </style>
  </head>
  <body>
    <!-- Top countdown timer bar -->
    <div id="timer-bar-container">
      <div id="timer-bar"></div>
    </div>

    <!-- UI Overlay for stage-specific components -->
    <div id="ui-overlay"></div>

    <!-- Main Fullscreen Stage -->
    <main id="stage"></main>

    <!-- Sidebar menu toggle button -->
    <button id="menu-toggle" aria-label="Toggle navigation drawer">☰</button>

    <!-- Slide-out sidebar drawer -->
    <aside id="control-sidebar">
      <div class="sidebar-scroll-area">
        <div style="font-size: 0.8rem; color: #a6adc8; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: bold;">
          Playlist Outline
        </div>
        <ul id="sectionList" class="section-list"></ul>
      </div>

      <!-- Sticky bottom media & volume toolbar -->
      <div id="sidebar-bottom-controls">
        <div style="font-size: 0.75rem; color: #a6adc8; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600;">
          Playback Controls
        </div>

        <div style="display: flex; gap: 8px;">
          <button id="disp-btn-play-pause" style="
            flex: 1;
            background: #4c566a;
            color: #fff;
            border: none;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
          ">Pause</button>

          <button id="disp-btn-mute" style="
            flex: 1;
            background: #4c566a;
            color: #fff;
            border: none;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
          ">Mute</button>
        </div>

        <div style="display: flex; align-items: center; gap: 8px; margin-top: 4px;">
          <span style="font-size: 0.8rem; color: #a6adc8;">Vol:</span>
          <input type="range" id="disp-volume-slider" min="0" max="1" step="0.05" value="1" style="
            flex: 1;
            cursor: pointer;
          " />
        </div>

        <div id="robotStatus" style="font-size: 0.75rem; color: #ef4444; text-align: center; margin-top: 4px;">
          Robot Disconnected
        </div>
      </div>
    </aside>

    <!-- Participant setup modal -->
    <div id="session-modal-overlay">
      <div class="session-modal">
        <h2>Enter Participant ID</h2>
        <input type="text" id="modalPidInput" placeholder="e.g. P-1001" autocomplete="off" autofocus />
        <span id="modalPidError" style="color: #ef4444; font-size: 0.8rem; display: none;">Participant ID is required.</span>
        <div class="session-modal-btns">
          <button type="button" id="btnModalRandom">Random</button>
          <button type="button" id="btnModalStart">Start Study</button>
        </div>
      </div>
    </div>

    <script src="/static/js/display.js"></script>
  </body>
</html>
